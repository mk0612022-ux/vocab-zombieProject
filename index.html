<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Vocab Zombie: IELTS Survival</title>
<!-- (A4) installable: Add to Home Screen opens it full screen, like an app -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vocab Zombie">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Every visible string comes from js/strings.js: data-i18n fills text,
     data-i18n-html fills text with markup, data-i18n-aria fills aria-label. -->

<canvas id="gameCanvas"></canvas>

<!-- ===================== MAIN MENU ===================== -->
<!-- The lobby (round 4) is built into this by js/lobby.js -->
<div id="screen-mainmenu" class="screen screen-lobby"></div>

<!-- (A4) a new version of the game is ready (js/pwa.js) -->
<div id="update-dialog" class="update-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="update-title">
  <div class="update-box">
    <div class="update-icon" aria-hidden="true">⬆️</div>
    <h3 id="update-title" data-i18n="update.title"></h3>
    <p data-i18n="update.text"></p>
    <div class="row-center">
      <button class="btn btn-primary" id="btn-update-reload" data-i18n="update.reload"></button>
      <button class="btn" id="btn-update-later" data-pad-back data-i18n="update.later"></button>
    </div>
  </div>
</div>

<!-- ===================== LEVEL SELECT ===================== -->
<div id="screen-levelselect" class="screen hidden">
  <h2 class="screen-title" data-i18n="levels.title"></h2>
  <div id="level-cards" class="level-cards"></div>
  <div class="row-center">
    <button class="btn" id="btn-levelselect-back" data-i18n="levels.back"></button>
  </div>
</div>

<!-- ===================== HOW TO PLAY ===================== -->
<div id="screen-howtoplay" class="screen hidden">
  <h2 class="screen-title" data-i18n="howto.title"></h2>
  <div class="howto-content" data-i18n-html="howto.body"></div>
  <div class="row-center">
    <button class="btn" id="btn-tutorial-replay" data-i18n="howto.tutorial"></button>
    <button class="btn" id="btn-howtoplay-back" data-i18n="common.back"></button>
  </div>
</div>

<!-- ===================== SETTINGS ===================== -->
<div id="screen-settings" class="screen hidden">
  <h2 class="screen-title" data-i18n="settings.title"></h2>
  <div class="settings-content" id="settings-content"></div>
  <div class="row-center"><button class="btn" id="btn-settings-back" data-i18n="common.back"></button></div>
</div>

<!-- ===================== LEADERBOARD ===================== -->
<div id="screen-leaderboard" class="screen hidden">
  <h2 class="screen-title" data-i18n="leaderboard.title"></h2>
  <div id="leaderboard-content" class="leaderboard-content"></div>
  <div class="row-center"><button class="btn" id="btn-leaderboard-back" data-i18n="common.back"></button></div>
</div>

<!-- ===================== ACHIEVEMENTS ===================== -->
<div id="screen-achievements" class="screen hidden">
  <h2 class="screen-title" data-i18n="achievements.title"></h2>
  <div id="achievements-content" class="achievements-content"></div>
  <div class="row-center"><button class="btn" id="btn-achievements-back" data-i18n="common.back"></button></div>
</div>

<!-- ===================== VOCABULARY LOG (category F) ===================== -->
<div id="screen-vocablog" class="screen hidden">
  <h2 class="screen-title" data-i18n="vocablog.title"></h2>
  <div class="leaderboard-tabs" id="vocablog-tabs"></div>
  <div id="vocablog-content" class="log-content"></div>
  <div class="row-center"><button class="btn" id="btn-vocablog-back" data-i18n="common.back"></button></div>
</div>

<!-- ===================== WEAPON LOG (category F) ===================== -->
<div id="screen-weaponlog" class="screen hidden">
  <h2 class="screen-title" data-i18n="weaponlog.title"></h2>
  <div class="leaderboard-tabs" id="weaponlog-tabs"></div>
  <div id="weaponlog-content" class="log-content"></div>
  <div class="row-center"><button class="btn" id="btn-weaponlog-back" data-i18n="common.back"></button></div>
</div>

<!-- ===================== IMPORT VOCAB ===================== -->
<div id="screen-import" class="screen hidden">
  <h2 class="screen-title" data-i18n="import.title"></h2>
  <div class="import-content">
    <p data-i18n-html="import.fileHint"></p>
    <input type="file" id="import-file-input" accept=".csv,.txt">
    <p style="margin-top:14px" data-i18n="import.ocrHint"></p>
    <input type="file" id="import-image-input" accept="image/*">
    <div id="import-ocr-status" class="import-status"></div>
    <div id="import-preview" class="import-preview"></div>
    <div class="settings-row"><label for="import-dest" data-i18n="import.dest"></label><select id="import-dest"></select></div>
    <div class="row-center">
      <button class="btn btn-primary" id="btn-import-save" disabled data-i18n="import.save"></button>
    </div>
    <div id="import-summary" class="import-summary"></div>
    <h3 style="margin-top:24px" data-i18n="import.sets"></h3>
    <div id="imported-sets-list" class="imported-sets-list"></div>
  </div>
  <div class="row-center"><button class="btn" id="btn-import-back" data-i18n="common.back"></button></div>
</div>

<!-- ===================== PRACTICE MODE SETUP ===================== -->
<div id="screen-practice-setup" class="screen hidden">
  <h2 class="screen-title" data-i18n="practice.title"></h2>
  <div class="practice-setup-content" id="practice-setup-content"></div>
  <div class="row-center"><button class="btn" id="btn-practice-back" data-i18n="common.back"></button></div>
</div>

<!-- ===================== PRACTICE MODE PLAY ===================== -->
<div id="screen-practice-play" class="screen hidden">
  <div class="practice-card" id="practice-card">
    <div class="practice-progress" id="practice-progress"></div>
    <div class="practice-word" id="practice-word"></div>
    <div class="practice-choices" id="practice-choices"></div>
    <div class="practice-feedback" id="practice-feedback"></div>
  </div>
  <div class="row-center"><button class="btn" id="btn-practice-quit" data-i18n="practice.quit"></button></div>
</div>

<!-- ===================== HUD (Gameplay) ===================== -->
<div id="hud" class="hud hidden">
  <div class="hud-top">
    <div class="hud-meaning-box">
      <div class="hud-meaning-label" data-i18n="hud.shootMeaning"></div>
      <div class="hud-meaning" id="hud-meaning">-</div>
      <button class="hud-speak icon-btn" id="hud-speak" data-i18n-aria="hud.hearAgain" data-label-key="hud.hearShort" data-tip-key="hud.hearAgain">🔊</button>
    </div>
    <!-- (round 2) the boss's health: name and title over a big red bar -->
    <div class="hud-boss-bar hidden" id="hud-boss-bar" role="progressbar" data-i18n-aria="hud.boss">
      <div class="hud-boss-name" id="hud-boss-name"></div>
      <div class="hud-boss-hp-track"><div class="hud-boss-hp-lag" id="hud-boss-hp-lag"></div><div class="hud-boss-hp-fill" id="hud-boss-hp-fill"></div>
        <!-- (new series, round 2) where phases 2 and 3 begin -->
        <div class="hud-boss-mark" id="hud-boss-mark2"></div><div class="hud-boss-mark" id="hud-boss-mark3"></div></div>
      <!-- what to do about the move under way -->
      <div class="hud-boss-hint hidden" id="hud-boss-hint"></div>
    </div>
    <!-- stacked under the word prompt and the boss bar, never on top of them -->
    <!-- category O: contextual tutorial card -->
    <div class="hud-tip hidden" id="hud-tip">
      <div class="hud-tip-title" id="hud-tip-title"></div>
      <div class="hud-tip-text" id="hud-tip-text"></div>
      <button class="hud-tip-skip" id="hud-tip-skip"><span data-i18n="hud.skipTutorial"></span> <span class="kbd-only">(T)</span></button>
    </div>
    <div class="hud-combo hidden" id="hud-combo"></div>
  </div>
  <div class="hud-resume-hint hidden" id="hud-resume-hint" data-i18n="hud.resume"></div>

  <div class="hud-crosshair" id="hud-crosshair"></div>
  <!-- category N: sniper scope overlay and charge-weapon wind-up meter -->
  <div class="hud-scope hidden" id="hud-scope"><div class="hud-scope-ring"></div><div class="hud-scope-h"></div><div class="hud-scope-v"></div></div>
  <div class="hud-charge hidden" id="hud-charge"><div class="hud-charge-fill" id="hud-charge-fill"></div></div>
  <div class="hud-interact-prompt hidden" id="hud-interact-prompt"></div>
  <div class="hud-challenge-box hidden" id="hud-challenge-box">
    <div class="hud-challenge-label" id="hud-challenge-label" data-i18n="hud.answerToUnlock"></div>
    <div class="hud-challenge-meaning" id="hud-challenge-meaning"></div>
    <div class="hud-boss-choices" id="hud-challenge-choices"></div>
    <div class="hud-boss-timer-track"><div class="hud-boss-timer-fill" id="hud-challenge-timer-fill"></div></div>
  </div>
  <div class="hud-hitmarker hidden" id="hud-hitmarker"></div>
  <div class="hud-damage-flash" id="hud-damage-flash"></div>
  <div class="hud-lowhp" id="hud-lowhp"></div>

  <div class="hud-bottom">
    <div class="hud-left">
      <div class="hud-stat hud-health"><span class="hud-icon">❤</span><div class="bar-track"><div class="bar-fill hp-fill" id="hud-hp-fill"></div></div><span id="hud-hp-text">100</span></div>
      <div class="hud-stat hud-stamina"><span class="hud-icon">⚡</span><div class="bar-track"><div class="bar-fill stamina-fill" id="hud-stamina-fill"></div></div></div>
      <div class="hud-stat hud-money-stat"><span class="hud-icon">💰</span><span id="hud-money">0</span></div>
      <div class="hud-stat hud-score-stat"><span class="hud-icon">⭐</span><span id="hud-score">0</span></div>
      <div class="hud-stat hud-wave-stat"><span id="hud-level-wave"></span></div>
      <div class="hud-stat hud-wave-stat"><span id="hud-zombies-left"></span></div>
      <div class="hud-perks hidden" id="hud-perks"></div>
    </div>
    <div class="hud-right">
      <div class="hud-weapon-name" id="hud-weapon-name"></div>
      <div class="hud-ammo" id="hud-ammo"></div>
      <div class="hud-objectives hidden" id="hud-objectives"></div>
      <!-- (round 3, I) the third floor's steps, compact -->
      <div class="hud-floor3 hidden" id="hud-floor3"></div>
      <div class="hud-slots" id="hud-slots"></div>
    </div>
  </div>
  <!-- (round 3, H) the abilities: icon, cooldown ring, key -->
  <div class="hud-abilities hidden" id="hud-abilities"></div>
  <div class="hud-ability-note hidden" id="hud-ability-note" role="status"></div>
  <!-- (round 3, J) "Checkpoint Saved - Wave 11" -->
  <div class="hud-checkpoint hidden" id="hud-checkpoint" role="status"><span class="cp-ico" aria-hidden="true">💾</span><span class="cp-text"></span></div>
  <canvas class="hud-minimap hidden" id="hud-minimap" role="img" data-i18n-aria="map.aria"></canvas>
  <div class="hud-fps-counter hidden" id="hud-fps-counter"></div>
  <div class="hud-achievement-toast hidden" id="hud-achievement-toast"></div>
  <div class="hud-purchase-banner hidden" id="hud-purchase-banner"></div>
  <div class="mystery-flash" id="mystery-flash"></div>
</div>

<!-- (round 2) a boss's cutscene: black bars, the title card, the red pen -->
<div id="cine" class="cine" aria-hidden="true">
  <div class="cine-bar cine-top"></div>
  <div class="cine-bar cine-bottom"></div>
  <div class="cine-card" id="cine-card">
    <div class="cine-wave" id="cine-wave"></div>
    <div class="cine-name" id="cine-name"></div>
    <div class="cine-title" id="cine-title"></div>
    <div class="cine-thai" id="cine-thai" lang="th"></div>
  </div>
  <div class="cine-slash" id="cine-slash"><i></i><i></i></div>
</div>
<div id="cine-flash" class="cine-flash"></div>

<!-- Touch controls -->
<div id="touch-controls" class="touch-controls hidden">
  <!-- (new series, round 1, E) frosted-glass buttons with icons; the name of
       each sits under it (data-label-key), the full one is its aria-label -->
  <div id="touch-joystick" class="touch-joystick">
    <svg class="tj-arrows" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 9 l-6 7 h12z M50 91 l-6 -7 h12z M9 50 l7 -6 v12z M91 50 l-7 -6 v12z"/></svg>
    <div id="touch-joystick-knob" class="touch-joystick-knob"></div>
  </div>
  <div id="touch-lookzone" class="touch-lookzone"></div>
  <button id="touch-fire" class="touch-btn touch-fire icon-btn" data-i18n-aria="touch.fireLabel" data-label-key="touch.fireLabel"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M10.2 2.5h3.6l1.2 3.2v9.8H9V5.7z"/><path d="M8 18h8M8.8 21h6.4M12 2.5v3"/></svg></button>
  <button id="touch-ads" class="touch-btn touch-ads icon-btn" data-i18n-aria="touch.aimLabel" data-label-key="touch.aimLabel"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v5M12 16.5v5M2.5 12h5M16.5 12h5"/><circle class="fill" cx="12" cy="12" r="1.3"/></svg></button>
  <button id="touch-interact" class="touch-btn touch-interact icon-btn" data-i18n-aria="touch.interactLabel" data-label-key="touch.interactLabel"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 12V5.5a1.5 1.5 0 0 1 3 0V11M11.5 10V4a1.5 1.5 0 0 1 3 0v6.5M14.5 10.5V6a1.5 1.5 0 0 1 3 0v7c0 4-2.5 7.5-6.5 7.5-3 0-4.5-1.5-6-4l-1.8-3.2a1.4 1.4 0 0 1 2.4-1.4L8.5 14"/></svg><span class="tb-key">E</span></button>
  <button id="touch-reload" class="touch-btn touch-reload icon-btn" data-i18n-aria="touch.reloadLabel" data-label-key="touch.reloadLabel"><span class="tb-ring" aria-hidden="true"></span><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path class="fill" d="M20.5 3.5v6h-6z"/></svg></button>
  <button id="touch-jump" class="touch-btn touch-jump icon-btn" data-i18n-aria="touch.jumpLabel" data-label-key="touch.jumpLabel"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l7-7 7 7M8 18l4-4 4 4"/></svg></button>
  <button id="touch-sprint" class="touch-btn touch-sprint icon-btn" data-i18n-aria="touch.sprintLabel" data-label-key="touch.sprintLabel"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><circle class="fill" cx="15" cy="4" r="2"/><path d="M8.5 9.5l3.5-2 3 2 2 3.5 3 .5M12 7.5l-1.5 6 4 3-1 5M10.5 13.5l-3 4-4-.5M5 9.5h3"/></svg></button>
  <button id="touch-pause" class="touch-btn touch-pause icon-btn" data-i18n-aria="touch.pauseLabel" data-label-key="touch.pauseLabel"><svg class="tb-ico" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
  <div id="touch-slots" class="touch-slots"></div>
  <!-- (round 3, H) one button per ability held -->
  <div id="touch-abilities" class="touch-abilities empty"></div>
</div>

<!-- ===================== TOUCH LAYOUT EDITOR (category B) ===================== -->
<!-- Sits over the live game view so controls are placed against what the
     player actually sees. The capture sheet swallows every pointer event so a
     drag can't reach the control underneath and fire the gun. -->
<div id="touchcfg-capture" class="hidden"></div>
<div id="touchcfg-panel" class="touchcfg-panel hidden">
  <div class="touchcfg-head">
    <strong data-i18n="touchcfg.title"></strong>
    <button id="touchcfg-collapse" data-i18n="touchcfg.hide"></button>
  </div>
  <div class="touchcfg-body">
    <div class="touchcfg-hint" data-i18n="touchcfg.hint"></div>
    <div class="touchcfg-row"><label data-i18n="touchcfg.selected"></label><span class="touchcfg-sel" id="touchcfg-selname" data-i18n="touchcfg.none"></span></div>
    <div class="touchcfg-row"><label><span data-i18n="touchcfg.size"></span> <span id="touchcfg-sizeval"></span></label>
      <input type="range" id="touchcfg-size" min="0.6" max="1.8" step="0.05" value="1" disabled></div>
    <div class="touchcfg-row"><label></label><div class="touchcfg-presets">
      <button class="touchcfg-preset" data-scale="0.8" disabled data-i18n="touchcfg.small"></button>
      <button class="touchcfg-preset" data-scale="1" disabled data-i18n="touchcfg.medium"></button>
      <button class="touchcfg-preset" data-scale="1.3" disabled data-i18n="touchcfg.large"></button>
      <button id="touchcfg-resetone" disabled data-i18n="touchcfg.resetOne"></button>
    </div></div>
    <div class="touchcfg-row"><label><span data-i18n="touchcfg.opacity"></span> <span id="touchcfg-opval"></span></label>
      <input type="range" id="touchcfg-op" min="0.2" max="1" step="0.05" value="1"></div>
    <div class="touchcfg-row"><label><span data-i18n="touchcfg.sens"></span> <span id="touchcfg-sensval"></span></label>
      <input type="range" id="touchcfg-sens" min="0.3" max="3" step="0.05" value="1"></div>
    <div class="touchcfg-row"><label><span data-i18n="touchcfg.bsens"></span> <span id="touchcfg-bsensval"></span></label>
      <input type="range" id="touchcfg-bsens" min="0.3" max="3" step="0.05" value="1"></div>
    <div class="touchcfg-row"><label></label><button id="touchcfg-hud" data-i18n="touchcfg.hudSizes"></button></div>
    <div class="touchcfg-actions">
      <button id="touchcfg-reset" data-i18n="touchcfg.resetAll"></button>
      <button id="touchcfg-done" class="primary" data-i18n="touchcfg.done"></button>
    </div>
  </div>
</div>

<!-- ===================== HUD SIZES (new series round 1, js/hudcfg.js) ===================== -->
<div id="hudcfg-panel" class="touchcfg-panel hudcfg-panel hidden" role="dialog" aria-modal="true" aria-labelledby="hudcfg-title">
  <div class="touchcfg-head"><strong id="hudcfg-title" data-i18n="hudcfg.title"></strong></div>
  <div class="touchcfg-body">
    <div class="touchcfg-hint" data-i18n="hudcfg.hint"></div>
    <div id="hudcfg-rows"></div>
    <div class="hudcfg-fit hidden" id="hudcfg-fit"></div>
    <div class="touchcfg-actions">
      <button id="hudcfg-reset" data-i18n="hudcfg.reset"></button>
      <button id="hudcfg-done" class="primary" data-pad-back><span data-i18n="hudcfg.done"></span> <span class="kbd-only">(Esc)</span></button>
    </div>
  </div>
</div>

<!-- ===================== SHOP (between waves) ===================== -->
<div id="screen-shop" class="screen hidden">
  <h2 class="screen-title" data-i18n="shop.title"></h2>
  <!-- (C) the countdown and Ready side by side, above the list, so Ready is
       always in reach on a phone however far the list scrolls -->
  <div class="shop-head">
    <div class="shop-timer" id="shop-timer"></div>
    <button class="btn btn-primary btn-ready" id="btn-shop-continue" data-i18n="shop.continue"></button>
  </div>
  <div class="shop-tip hidden" id="shop-tip"></div>
  <div class="shop-bonus hidden" id="shop-bonus"></div>
  <div class="shop-money"><span data-i18n="shop.money"></span><span id="shop-money">0</span></div>
  <div class="shop-grid" id="shop-grid"></div>
</div>

<!-- ===================== CRATE OPEN ===================== -->
<div id="screen-crate" class="screen hidden">
  <div class="crate-open-panel" id="crate-open-panel">
    <div class="crate-rarity-label" id="crate-rarity-label"></div>
    <div class="crate-weapon-name" id="crate-weapon-name"></div>
    <div class="crate-weapon-stats" id="crate-weapon-stats"></div>
    <button class="btn btn-primary" id="btn-crate-continue" data-i18n="crate.ok"></button>
  </div>
</div>

<!-- ===================== MYSTERY WEAPON BOX ===================== -->
<div id="screen-mystery" class="screen hidden">
  <div class="mystery-wrap">
    <div class="mystery-title" id="mystery-title" data-i18n="mystery.pick"></div>
    <div class="mystery-sub" id="mystery-sub" data-i18n="mystery.pickSub"></div>
    <div class="mystery-cards" id="mystery-cards"></div>
    <div class="mystery-result hidden" id="mystery-result">
      <div class="mystery-result-rarity" id="mystery-result-rarity"></div>
      <div class="mystery-result-name" id="mystery-result-name"></div>
      <div class="mystery-result-stats" id="mystery-result-stats"></div>
      <button class="btn btn-primary" id="btn-mystery-take" data-i18n="mystery.take"></button>
    </div>
  </div>
</div>

<!-- ===================== INVENTORY FULL (js/loadout.js) ===================== -->
<div id="screen-inventory" class="screen hidden">
  <h2 class="screen-title" data-i18n="inv.title"></h2>
  <p class="inv-sub" data-i18n="inv.sub"></p>
  <div class="inv-new" id="inv-new"></div>
  <div class="inv-slots" id="inv-slots"></div>
  <p class="inv-note" id="inv-note"></p>
  <div class="row-center"><button class="btn" id="btn-inv-keep" data-pad-back><span data-i18n="inv.keep"></span> <span class="kbd-only">(Esc)</span></button></div>
</div>

<!-- ===================== CUSTOM VOCABULARY (js/customvocab.js) ===================== -->
<div id="screen-customvocab" class="screen hidden">
  <h2 class="screen-title" data-i18n="cv.title"></h2>
  <div class="cv-content">
    <p class="cv-intro" data-i18n="cv.intro"></p>
    <div class="cv-form">
      <label class="cv-field"><span data-i18n="cv.en"></span><input id="cv-en" type="text" maxlength="32" autocomplete="off" autocapitalize="off" spellcheck="false" lang="en"></label>
      <label class="cv-field"><span data-i18n="cv.th"></span><input id="cv-th" type="text" maxlength="80" autocomplete="off" lang="th"></label>
      <label class="cv-field"><span data-i18n="cv.level"></span><select id="cv-level"></select></label>
      <div class="cv-buttons">
        <button class="btn btn-primary" id="cv-save" data-i18n="cv.add"></button>

<!-- shown before any script has loaded, so it keeps a literal fallback -->
<div id="loading-overlay" class="loading-overlay">

  <div class="loading-error hidden" id="loading-error"></div>
</div>
<script>
// (A4) A file that fails to load (offline before the game was ever kept,
// say) is named on this screen, rather than it saying "Loading..." for ever.
// Plain script, before the game's own: it has to work when they don't.
window.__loadErrors = [];
window.addEventListener("error", function (e) {
  var t = e.target;
  window.__loadErrors.push(t && (t.src || t.href) ? String(t.src || t.href) : String(e.message || "error"));
}, true);
window.addEventListener("load", function () {
  setTimeout(function () {
    var o = document.getElementById("loading-overlay");
    if (!o || o.classList.contains("hidden") || !window.__loadErrors.length) return;
    var el = document.getElementById("loading-error");
    var T = window.G && G.T ? G.T : null;
    el.textContent = (T ? T("common.loadFailed") : "The game could not start. Check your connection and reload.") +
      " (" + window.__loadErrors.slice(0, 3).map(function (u) { return u.split("/").pop(); }).join(", ") + ")";
    el.classList.remove("hidden");
  }, 1500);
});
</script>
